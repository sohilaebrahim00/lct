<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) — must be static HTML, not injected by React.
         Google Tag Assistant's live-connection check expects to find this
         tag already present before any JS bundle runs; the previous
         React-injected version (a useEffect inside `Analytics`, mounted
         deep in the component tree) only fired after hydration, which is
         late enough that Tag Assistant reported "could not connect" even
         though the tag eventually loaded fine for real GA4/Ads reporting.
         `src/lib/tracking.ts` no longer defines `window.gtag` or loads this
         script — it only calls the `window.gtag(...)` this sets up. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18237817494"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18237817494');
    </script>
    <!--
      The sitewide <title>/description/Open Graph tags and JSON-LD are
      written in at build time by the staticCrawlerContent plugin
      (vite.config.ts, data in src/lib/site-head.ts), so crawlers that do not
      run JavaScript see them. main.tsx removes those static copies before
      React renders: <HeadContent/> appends its managed tags rather than
      replacing pre-existing ones, so leaving them would produce two
      <title>/description tags on every page.
    -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx),
         not loaded from fonts.googleapis.com: a render-blocking third-party
         stylesheet here blanked the whole site on networks that silently
         drop Google Fonts (module scripts wait for pending stylesheets). -->
  </head>
  <body>
    <!-- Filled at build time with a plain-HTML summary of the business
         (staticCrawlerContent in vite.config.ts), including the no-JavaScript
         fallback that used to be a <noscript> block here. React replaces it
         on its first render. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
