<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) — must be static HTML, not injected by React.
         Google Tag Assistant's live-connection check expects to find this
         tag already present before any JS bundle runs; the previous
         React-injected version (a useEffect inside `Analytics`, mounted
         deep in the component tree) only fired after hydration, which is
         late enough that Tag Assistant reported "could not connect" even
         though the tag eventually loaded fine for real GA4/Ads reporting.
         `src/lib/tracking.ts` no longer defines `window.gtag` or loads this
         script — it only calls the `window.gtag(...)` this sets up. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18237817494"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'AW-18237817494');
    </script>
    <!--
      No static <title>/<meta name="description">/<meta name="theme-color">
      here on purpose: `__root.tsx`'s `head()` (via TanStack Router's
      <HeadContent/>) is the single source for these, with each route's own
      `head()` overriding it per-page. HeadContent appends its managed tags
      rather than replacing pre-existing static ones with the same
      name/property, so a static tag here would sit alongside — not
      override — the dynamic one, producing two <title>/description tags on
      every page (this was verified happening before this fix).
    -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx),
         not loaded from fonts.googleapis.com: a render-blocking third-party
         stylesheet here blanked the whole site on networks that silently
         drop Google Fonts (module scripts wait for pending stylesheets). -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown only when JavaScript is disabled or stripped (some business
         web proxies remove scripts from sites they haven't categorized) —
         the SPA renders nothing at all in that case, so this keeps a way
         to reach the company instead of a blank page. -->
    <noscript>
      <div style="max-width:32rem;margin:15vh auto;padding:0 1rem;font-family:Georgia,serif;color:#f4efe6;background:#141210;text-align:center;line-height:1.6">
        <h1 style="font-weight:500">LCT Universal Executive Transports</h1>
        <p>Premium chauffeured transportation in Dallas–Fort Worth, available 24/7.</p>
        <p>This site needs JavaScript. To book or request a quote, call
          <a href="tel:+18886154065" style="color:#d4b46a">+1 (888) 615-4065</a> or email
          <a href="mailto:reservations@lctuniversal.com" style="color:#d4b46a">reservations@lctuniversal.com</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
